plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.junit.jupiter:junit-jupiter-engine:5.13.4'
    implementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    implementation 'org.junit.jupiter:junit-jupiter-params:5.13.4'
    implementation 'com.codeborne:selenide:7.13.0'
    testImplementation 'org.assertj:assertj-core:3.27.4'
    implementation 'io.qameta.allure:allure-junit5:2.29.1'
}
compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
}